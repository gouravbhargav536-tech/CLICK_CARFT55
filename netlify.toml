[build]
  publish = "dist"
  functions = "netlify/functions"

# Redirect API calls to Netlify Functions
[[redirects]]
  from = "/api/tts"
  to = "/.netlify/functions/tts"
  status = 200

[[redirects]]
  from = "/api/cloud-tts"
  to = "/.netlify/functions/tts"
  status = 200

# SPA fallback rule for frontend client routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
